<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:radial-gradient(circle,#4b006e,#12001f);
    color:white;
    font-family:'Segoe UI',sans-serif;
    text-align:center;
}


/* Stars */

.star{
    position:absolute;
    color:white;
    animation:shoot 3s linear infinite;
}

@keyframes shoot{
    from{
        transform:translateX(0) translateY(0);
        opacity:1;
    }
    to{
        transform:translateX(300px) translateY(300px);
        opacity:0;
    }
}



.container{
    position:relative;
    top:12%;
    z-index:5;
}


h1{
    font-size:45px;
    color:#ff9eea;
    text-shadow:0 0 30px pink;
    animation:glow 2s infinite alternate;
}


@keyframes glow{
    from{filter:brightness(1);}
    to{filter:brightness(2);}
}


h2{
    margin:20px;
}


p{
    width:80%;
    margin:auto;
    font-size:20px;
    line-height:1.7;
}



.cake{
    font-size:80px;
    animation:bounce 1s infinite alternate;
}


@keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-15px);}
}



button{

    margin:15px;
    padding:15px 30px;
    border-radius:30px;
    border:none;
    background:#ff4da6;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 20px pink;

}


button:hover{
    transform:scale(1.1);
}



.heart{

position:absolute;
font-size:30px;
animation:heartmove 3s linear forwards;

}


@keyframes heartmove{

0%{
transform:scale(1);
opacity:1;
}

100%{
transform:translateY(-300px) scale(2);
opacity:0;
}

}



.hidden{

display:none;
font-size:22px;
margin-top:20px;
color:#ffd6f6;

}


.fire{

position:absolute;
font-size:35px;
animation:boom 1s forwards;

}


@keyframes boom{

0%{
transform:scale(0);
}

100%{
transform:scale(4);
opacity:0;
}

}


</style>

</head>


<body onclick="heartClick(event)">



<div class="container">


<h1>🎉 Happy Birthday ❤️</h1>

<h2>My Beautiful Babe 💕</h2>


<div class="cake">
🎂
</div>


<p>
Today is a special day because the world got someone as amazing as you.
<br><br>

Your smile makes ordinary moments magical.
<br>
May your life always be filled with happiness, dreams, and love.

</p>



<button onclick="wish(event)">
✨ Make A Wish ✨
</button>


<a href="letter.html" target="_blank">
<button>
💌 Open Secret Letter
</button>
</a>




</div>




<script>


// floating hearts

function createHeart(){

let h=document.createElement("div");

h.className="heart";
h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";
h.style.top="100vh";

document.body.appendChild(h);


setTimeout(()=>{
h.remove();
},3000);

}


setInterval(createHeart,400);




// wish button

function wish(e){

e.stopPropagation();

for(let i=0;i<20;i++){

let f=document.createElement("div");

f.className="fire";
f.innerHTML="✨";

f.style.left=Math.random()*100+"vw";
f.style.top=Math.random()*80+"vh";


document.body.appendChild(f);


setTimeout(()=>{
f.remove();
},1000);

}


alert("Your wish has been sent to the stars ✨❤️");

}




// secret letter

function letter(e){

e.stopPropagation();

document.getElementById("secret")
.style.display="block";

}




// click heart explosion

function heartClick(e){

for(let i=0;i<5;i++){

let h=document.createElement("div");

h.className="heart";
h.innerHTML="💖";

h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";

document.body.appendChild(h);


setTimeout(()=>{
h.remove();
},3000);

}

}



// shooting stars

setInterval(()=>{

let s=document.createElement("div");

s.className="star";
s.innerHTML="⭐";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*40+"vh";

document.body.appendChild(s);


setTimeout(()=>{
s.remove();
},3000);


},800);



</script>


</body>
</html>
